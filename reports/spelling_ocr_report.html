<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling OCR Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(160deg, #5a7a9c 0%, #4a6a8a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
            padding: 16px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
            text-align: left;
        }

        .page-header h1 {
            color: #222;
            margin: 0;
            font-size: 1.15em;
            font-weight: 700;
        }

        .game-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .game-button {
            background: #5a7a9c;
            color: white;
            border: none;
            padding: 14px 10px;
            border-radius: 11px;
            font-size: 0.92em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        .game-button:active {
            opacity: 0.92;
        }

        .back-button {
            flex: 0 0 auto;
            padding: 7px 10px;
            background: #eef2f6;
            color: #4a6a8a;
            border: 1px solid #c5d0dc;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.82em;
            font-weight: 600;
            white-space: nowrap;
        }

        .back-button:active {
            background: #e2e8f0;
        }

        .profile-section {
            margin-bottom: 18px;
            text-align: left;
        }

        .profile-section h3 {
            color: #64748b;
            margin-bottom: 8px;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">

            <a href="index.html" class="back-button">← Back</a>
        </div>

                <a href="spelling_ocr_detail.html?profile=AM&game=EngSpellingOCR" class="game-button">English Spelling OCR</a>
                <a href="spelling_ocr_detail.html?profile=AM&game=FrSpellingOCR" class="game-button">French Spelling OCR</a>
            </div>
        </div>

        <div class="profile-section">
            <h3>Profile BM</h3>
            <div class="game-selector">
                <a href="spelling_ocr_detail.html?profile=BM&game=EngSpellingOCR" class="game-button">English Spelling OCR</a>
                <a href="spelling_ocr_detail.html?profile=BM&game=FrSpellingOCR" class="game-button">French Spelling OCR</a>
            </div>
        </div>

        <div class="profile-section">
            <h3>Profile TE</h3>
            <div class="game-selector">
                <a href="spelling_ocr_detail.html?profile=TE&game=EngSpellingOCR" class="game-button">English Spelling OCR</a>

        </div>
    </div>
