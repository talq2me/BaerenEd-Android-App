<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BaerenEd</title>
  <link rel="stylesheet" href="baeren.css">
</head>
<body>
  <header class="top">
    <h1>Battle hub</h1>
    <div id="counts" class="counts"></div>
    <div class="top-actions">
      <div class="profiles" id="profiles">
        <button type="button" data-profile="AM">AM</button>
        <button type="button" data-profile="BM">BM</button>
        <button type="button" data-profile="TE">TE</button>
      </div>
      <button type="button" id="rewardBtn">Ask for Time</button>
      <button type="button" id="configBtn">Parent setup</button>
    </div>
  </header>
  <div class="wrap">
    <form id="setup" class="panel" hidden>
      <h2>Parent setup</h2>
      <p>The key stays in this browser. It is not saved in the page.</p>
      <label for="pinEntry">PIN</label>
      <input id="pinEntry" type="password" inputmode="numeric" autocomplete="off">
      <div class="row" id="pinRow" hidden><button type="button" id="pinBtn">Continue</button></div>
      <div id="secretFields" hidden>
        <label for="supabaseUrl">Supabase URL</label>
        <input id="supabaseUrl" autocomplete="off" spellcheck="false">
        <label for="supabaseKey">Supabase API key</label>
        <input id="supabaseKey" autocomplete="off" spellcheck="false">
        <label for="newPin">New PIN</label>
        <input id="newPin" type="password" inputmode="numeric" autocomplete="off">
        <div class="row"><button type="submit">Save</button></div>
      </div>
      <p id="setupMsg"></p>
    </form>

    <section id="hub" class="panel" hidden>
      <a class="task pokedex-link" href="pokedex.html" id="pokedexLink">My Pokemon</a>
      <p id="battleMsg" class="battle-msg"></p>
      <div class="row battle-row"><button type="button" id="battleBtn" disabled>Battle</button></div>
      <div class="battle" id="battle"></div>
      <div class="row maps">
        <a class="task" href="map.html?map=required">Required</a>
        <button type="button" id="practiceBtn" disabled>Practice</button>
      </div>
      <p id="hubMsg"></p>
    </section>
    <p id="needSetup" hidden>Save the Supabase URL and key in Parent setup to load the games.</p>
  </div>
  <div id="victory" class="victory" hidden>
    <div class="victory-card">
      <h2>Victory!</h2>
      <img id="victoryImg" alt="">
      <p id="victoryName"></p>
      <button type="button" id="victoryClose">Continue</button>
    </div>
  </div>
  <script src="baeren.js"></script>
  <script src="tasks.js"></script>
  <script src="battle.js"></script>
  <script>
    function meter(label, id, pct) {
      const row = document.createElement("div");
      row.className = "meter";
      const name = document.createElement("span");
      name.textContent = label;
      const track = document.createElement("div");
      track.className = "track";
      const fill = document.createElement("div");
      fill.className = "fill";
      fill.id = id;
      fill.style.width = pct + "%";
      track.appendChild(fill);
      row.appendChild(name);
      row.appendChild(track);
      return row;
    }

    function fighterCard(poke, who, power) {
      const card = document.createElement("div");
      card.className = "fighter";
      card.dataset.who = who;
      const img = document.createElement("img");
      const name = document.createElement("div");
      if (poke) {
        img.alt = "#" + poke.pokenum;
        img.src = Baeren.assetUrl("images/pokeSprites/sprites/pokemon/" + poke.filename);
        name.textContent = "#" + poke.pokenum;
      } else {
        img.alt = "";
        name.textContent = "None yet";
      }
      card.appendChild(img);
      card.appendChild(name);
      card.appendChild(meter("HP", who + "Hp", 100));
      card.appendChild(meter("Power", who + "Power", power));
      return card;
    }

    function renderBattle(all, unlocked, power) {
      const owned = all.filter(function (poke) { return poke.prefix <= unlocked; });
      const playerPrefix = owned.reduce(function (max, poke) { return Math.max(max, poke.prefix); }, 0);
      const player = playerPrefix ? Tasks.pickAtPrefix(all, playerPrefix) : null;
      const boss = Tasks.pickAtPrefix(all, unlocked + 1);
      const battle = document.getElementById("battle");
      battle.textContent = "";
      battle.appendChild(fighterCard(player, "player", power));
      const vs = document.createElement("div");
      vs.className = "vs";
      vs.textContent = "VS";
      battle.appendChild(vs);
      battle.appendChild(fighterCard(boss, "boss", 100));
      window.hubBattle = window.hubBattle || {};
      window.hubBattle.unlocked = unlocked;
      window.hubBattle.bossName = boss ? "#" + boss.pokenum : "Boss";
      window.hubBattle.bossFile = boss ? boss.filename : "";
    }

    function renderCounts(hub) {
      const bank = Number(hub.kid_bank_balance || 0).toFixed(2);
      document.getElementById("counts").textContent =
        "$" + bank + " \u{1F3E6}   " +
        (hub.coins_earned || 0) + " \u{1FA99}   " +
        (hub.berries_earned || 0) + " \u{1F34D}   " +
        (hub.banked_mins || 0) + " \u{23F1}";
    }

    const PRACTICE_FILL = 16;

    function countable(task) {
      const how = Tasks.kind(task);
      return how !== "skip" && how !== "later";
    }

    async function loadHub(profile) {
      const hub = await Baeren.rpc("af_get_battle_hub_counts", { p_profile: profile }) || {};
      const rows = await Baeren.rpc("af_web_list_tasks", { p_profile: profile }) || [];
      const requiredRows = await Baeren.rpc("af_get_tasks_required", { p_profile: profile });
      const practiceRows = await Baeren.rpc("af_get_tasks_practice", { p_profile: profile });
      const battleState = await Baeren.rpc("af_web_battle_state", { p_profile: profile }) || {};
      const requiredDone = Tasks.completionMap(requiredRows, true);
      const practiceDoneMap = Tasks.completionMap(practiceRows, false);
      const required = rows.filter(function (task) {
        return task.section === "required" && countable(task);
      });
      const practice = rows.filter(function (task) {
        return task.section === "optional" && countable(task);
      });
      const allDone = required.every(function (task) { return requiredDone[task.title] === true; });
      const practiceDone = practice.filter(function (task) { return practiceDoneMap[task.title] === true; }).length;
      document.getElementById("hub").hidden = false;
      document.getElementById("needSetup").hidden = true;
      renderCounts(hub);
      document.getElementById("pokedexLink").textContent = "My Pokemon (" + (hub.pokemon_unlocked || 0) + ")";
      const practiceBtn = document.getElementById("practiceBtn");
      practiceBtn.disabled = !allDone;
      const unlocked = Number(hub.pokemon_unlocked || 0);
      const battledToday = battleState.battleToday === true;
      let doneCount;
      let total;
      let power;
      let ready;
      if (battledToday) {
        const gained = Math.max(0, practiceDone - Number(battleState.practiceBaseline || 0));
        doneCount = gained;
        total = PRACTICE_FILL;
        power = Math.min(100, Math.round(gained * 100 / PRACTICE_FILL));
        ready = gained >= PRACTICE_FILL;
      } else {
        doneCount = required.filter(function (task) { return requiredDone[task.title] === true; }).length;
        total = required.length;
        power = total > 0 ? Math.round(doneCount * 100 / total) : 0;
        ready = total > 0 && doneCount >= total;
      }
      document.getElementById("hubMsg").textContent = battledToday
        ? (ready ? "Practice power is full." : "Finish Practice tasks to fill the power bar.")
        : (allDone ? "Required games are done." : "Finish the Required games to open Practice.");
      const battleBtn = document.getElementById("battleBtn");
      battleBtn.disabled = !ready;
      battleBtn.textContent = "Battle";
      window.hubBattle = {
        unlocked: unlocked,
        done: doneCount,
        total: total,
        practiceDone: practiceDone,
        practiceFill: PRACTICE_FILL
      };
      try {
        renderBattle(await Tasks.loadPokemonManifest(), unlocked, power);
      } catch (err) {
        document.getElementById("battle").textContent = err.message || String(err);
      }
    }

    function showArena() {
      document.body.classList.add("arena");
      const png = Baeren.assetUrl("images/arena.png");
      const webp = Baeren.assetUrl("images/arena.webp");
      const probe = new Image();
      probe.onload = function () { document.body.style.backgroundImage = "url(\"" + probe.src + "\")"; };
      probe.onerror = function () {
        if (probe.src.indexOf(".webp") >= 0) probe.src = png;
      };
      probe.src = webp;
    }

    async function loadProfile(profile) {
      if (window.Battle) Battle.cancel();
      const victory = document.getElementById("victory");
      if (victory) victory.hidden = true;
      Baeren.setProfile(profile);
      document.querySelectorAll("#profiles button").forEach(function (btn) {
        btn.classList.toggle("on", btn.dataset.profile === profile);
      });
      if (!Baeren.hasDb()) {
        document.getElementById("hub").hidden = true;
        document.getElementById("needSetup").hidden = false;
        return;
      }
      await Baeren.ensureDailyReset();
      await loadHub(profile);
    }

    const setup = document.getElementById("setup");
    const secret = document.getElementById("secretFields");
    const pinRow = document.getElementById("pinRow");

    function unlockPin() {
      if (Baeren.checkPin(document.getElementById("pinEntry").value)) {
        secret.hidden = false;
        pinRow.hidden = true;
        document.getElementById("supabaseUrl").value = Baeren.cfg().url;
        document.getElementById("supabaseKey").value = Baeren.cfg().key;
        document.getElementById("setupMsg").textContent = "";
      } else {
        document.getElementById("setupMsg").textContent = "Wrong PIN.";
      }
    }

    document.getElementById("configBtn").addEventListener("click", function () {
      setup.hidden = !setup.hidden;
      const hasPin = Boolean(Baeren.cfg().pin);
      secret.hidden = hasPin;
      pinRow.hidden = !hasPin;
      document.getElementById("setupMsg").textContent = hasPin ? "Enter the PIN to change the saved key." : "Choose a PIN, then save the Supabase URL and key.";
    });

    document.getElementById("pinBtn").addEventListener("click", unlockPin);
    document.getElementById("pinEntry").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && !pinRow.hidden) {
        ev.preventDefault();
        unlockPin();
      }
    });

    setup.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (!pinRow.hidden) {
        unlockPin();
        return;
      }
      const url = document.getElementById("supabaseUrl").value.trim();
      const key = document.getElementById("supabaseKey").value.trim();
      const pin = (document.getElementById("newPin").value || document.getElementById("pinEntry").value).trim();
      if (!url || !key || !pin) {
        document.getElementById("setupMsg").textContent = "URL, key, and PIN are required.";
        return;
      }
      Baeren.saveSetup(url, key, pin, Baeren.cfg().profile);
      document.getElementById("setupMsg").textContent = "Saved in this browser.";
      setup.hidden = true;
    });

    document.getElementById("rewardBtn").addEventListener("click", async function () {
      const pin = window.prompt("Parent PIN");
      if (pin == null) return;
      if (!Baeren.checkPin(pin)) {
        document.getElementById("hubMsg").textContent = "Wrong PIN.";
        return;
      }
      const raw = window.prompt("Minutes to add to the reward bank");
      if (raw == null) return;
      const minutes = parseInt(raw, 10);
      if (!Number.isFinite(minutes) || minutes === 0) return;
      try {
        await Baeren.rpc("af_reward_time_add", { p_profile: Baeren.cfg().profile, p_minutes: minutes });
        await loadHub(Baeren.cfg().profile);
      } catch (err) {
        document.getElementById("hubMsg").textContent = err.message || String(err);
      }
    });

    document.getElementById("battleBtn").addEventListener("click", function () {
      Battle.start().catch(function (err) {
        document.getElementById("battleMsg").textContent = err.message || String(err);
      });
    });

    document.getElementById("victoryClose").addEventListener("click", function () {
      document.getElementById("victory").hidden = true;
      loadHub(Baeren.cfg().profile).catch(function (err) {
        document.getElementById("hubMsg").textContent = err.message || String(err);
      });
    });

    document.getElementById("practiceBtn").addEventListener("click", function () {
      if (!document.getElementById("practiceBtn").disabled) location.href = "map.html?map=practice";
    });

    document.getElementById("profiles").addEventListener("click", function (ev) {
      const btn = ev.target.closest("button");
      if (!btn) return;
      loadProfile(btn.dataset.profile).catch(function (err) {
        document.getElementById("hubMsg").textContent = err.message || String(err);
      });
    });

    showArena();
    loadProfile(Baeren.cfg().profile).catch(function (err) {
      document.getElementById("needSetup").hidden = false;
      document.getElementById("needSetup").textContent = err.message || String(err);
    });
  </script>
</body>
</html>
