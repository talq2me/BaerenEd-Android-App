<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Chore</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard', 'Arial Rounded MT Bold', sans-serif;
            background-color: #fffcf9;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .game-container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #2e7d32;
            margin: 0 0 6px;
        }
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin: 4px 0 10px;
            text-align: left;
        }
        .description {
            font-size: 18px;
            color: #444;
            margin: 0;
            flex: 1;
            min-width: 0;
        }
        .reward {
            font-size: 16px;
            color: #666;
            margin: 0;
            flex-shrink: 0;
            text-align: right;
        }
        .audio-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 8px 0 12px;
            flex-wrap: wrap;
        }
        .green-button, .record-button, .stop-button {
            font-family: inherit;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            margin: 0;
            padding: 14px 28px;
            font-size: 22px;
            line-height: 1.2;
            box-sizing: border-box;
            color: white;
        }
        .green-button { background-color: #4CAF50; }
        .record-button { background-color: #ff6b6b; }
        .stop-button { background-color: #e53935; }
        .green-button:hover, .record-button:hover, .stop-button:hover {
            background-color: #ff8c00;
            transform: scale(1.05);
        }
        .green-button:disabled, .record-button:disabled, .stop-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .hidden { display: none; }
        .recorder-panel {
            margin: 8px 0;
            padding: 16px;
            background: #fff3cd;
            border-radius: 10px;
            border: 2px solid #ffeaa7;
        }
        .timer {
            font-size: 36px;
            font-weight: bold;
            color: #c62828;
            margin: 8px 0 12px;
            font-variant-numeric: tabular-nums;
        }
        .timer.idle { color: #666; font-size: 28px; }
        .recording-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e53935;
            margin-right: 8px;
            vertical-align: middle;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        audio {
            width: 100%;
            max-width: 480px;
            margin: 8px 0 0;
        }
        .message {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 id="choreTitle">Audio Chore</h1>
        <div class="meta-row">
            <p class="description" id="choreDescription">Record yourself practicing piano.</p>
            <p class="reward" id="choreReward">Reward: $0 (parent reviews)</p>
        </div>

        <div class="audio-actions">
            <button class="record-button" id="recordBtn" onclick="toggleRecord()">Record</button>
            <button class="green-button hidden" id="doneBtn" onclick="submitAudio()">Done</button>
        </div>

        <div class="recorder-panel" id="recorderPanel">
            <div class="timer idle" id="timerDisplay">0:00</div>
            <audio id="playback" controls class="hidden"></audio>
        </div>

        <div id="messageContainer"></div>
    </div>

    <script>
        /**
         * Query params (from config url):
         *   choreId      - required; used in image_uploads.task = chore_{id}_r{reward}_{yyyy-MM-dd}
         *   title        - screen title
         *   description  - instructions
         *   rewardCash   - dollars for parent report grant default
         *   maxSeconds   - optional max recording length (default 300 = 5 min)
         */
        const DEFAULT_MAX_SECONDS = 300;

        let mediaRecorder = null;
        let mediaStream = null;
        let recordedChunks = [];
        let recordedBlob = null;
        let recordedDataUrl = null;
        let recordedMimeType = 'audio/webm';
        let recording = false;
        let submitting = false;
        let timerInterval = null;
        let recordStartedAt = 0;
        let elapsedMs = 0;
        let maxSeconds = DEFAULT_MAX_SECONDS;

        let choreId = '';
        let choreTitle = 'Audio Chore';
        let choreDescription = 'Record yourself practicing piano.';
        let rewardCash = 0;

        function formatRewardCash(amount) {
            const value = Number(amount) || 0;
            if (Math.abs(value - Math.round(value)) < 0.001) {
                return '$' + Math.round(value);
            }
            return '$' + value.toFixed(2);
        }

        function formatMmSs(totalSeconds) {
            const s = Math.max(0, Math.floor(totalSeconds));
            const m = Math.floor(s / 60);
            const rem = s % 60;
            return m + ':' + String(rem).padStart(2, '0');
        }

        /** America/Toronto calendar date as yyyy-MM-dd. */
        function torontoDateYmd() {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Toronto',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date());
        }

        /**
         * Parent report parses: chore_{choreId}_r{reward}_{date}
         * Same key shape as photo chores so grant/resend works unchanged.
         */
        function audioTaskKey(id, reward) {
            const centsSafe = String(Number(reward) || 0);
            return 'chore_' + id + '_r' + centsSafe + '_' + torontoDateYmd();
        }

        function readParams() {
            const params = new URLSearchParams(window.location.search);
            choreId = (params.get('choreId') || '').trim();
            choreTitle = (params.get('title') || 'Audio Chore').trim() || 'Audio Chore';
            choreDescription = (params.get('description') || '').trim()
                || 'Record yourself practicing piano.';
            const rawReward = params.get('rewardCash');
            rewardCash = rawReward != null && rawReward !== '' ? Number(rawReward) : 0;
            if (Number.isNaN(rewardCash)) rewardCash = 0;
            const rawMax = params.get('maxSeconds');
            maxSeconds = rawMax != null && rawMax !== '' ? Number(rawMax) : DEFAULT_MAX_SECONDS;
            if (!Number.isFinite(maxSeconds) || maxSeconds < 10) maxSeconds = DEFAULT_MAX_SECONDS;
        }

        function applyUi() {
            document.getElementById('choreTitle').textContent = choreTitle;
            document.getElementById('choreDescription').textContent = choreDescription;
            document.getElementById('choreReward').textContent =
                'Reward: ' + formatRewardCash(rewardCash) + ' (parent reviews)';
            if (!choreId) {
                showMessage('This chore is missing choreId in the URL.', 'error');
                document.getElementById('recordBtn').disabled = true;
            }
        }

        function hideMessage() {
            document.getElementById('messageContainer').innerHTML = '';
        }

        function showMessage(text, type) {
            document.getElementById('messageContainer').innerHTML =
                '<div class="message ' + (type || 'info') + '">' + text + '</div>';
        }

        function setBusy(busy) {
            submitting = busy;
            document.getElementById('recordBtn').disabled = busy || !choreId;
            document.getElementById('doneBtn').disabled = busy;
        }

        function pickMimeType() {
            const types = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/ogg;codecs=opus',
                'audio/mp4',
                'audio/aac'
            ];
            if (typeof MediaRecorder === 'undefined' || typeof MediaRecorder.isTypeSupported !== 'function') {
                return '';
            }
            for (let i = 0; i < types.length; i++) {
                if (MediaRecorder.isTypeSupported(types[i])) return types[i];
            }
            return '';
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timerDisplay');
            const secs = elapsedMs / 1000;
            if (recording) {
                el.classList.remove('idle');
                el.innerHTML = '<span class="recording-dot"></span>' + formatMmSs(secs);
            } else {
                el.classList.add('idle');
                el.textContent = formatMmSs(secs);
            }
        }

        function startTimer() {
            recordStartedAt = Date.now();
            elapsedMs = 0;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                elapsedMs = Date.now() - recordStartedAt;
                updateTimerDisplay();
                if (elapsedMs >= maxSeconds * 1000) {
                    stopRecording();
                    showMessage('Max length reached (' + formatMmSs(maxSeconds) + '). You can submit or re-record.', 'info');
                }
            }, 200);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            if (recordStartedAt) {
                elapsedMs = Date.now() - recordStartedAt;
            }
            updateTimerDisplay();
        }

        function blobToDataUrl(blob) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();
                reader.onload = function() { resolve(reader.result); };
                reader.onerror = function() { reject(reader.error || new Error('Failed to read recording')); };
                reader.readAsDataURL(blob);
            });
        }

        function showRecordedUi() {
            const playback = document.getElementById('playback');
            if (recordedBlob) {
                playback.src = URL.createObjectURL(recordedBlob);
                playback.classList.remove('hidden');
            }
            document.getElementById('recordBtn').textContent = 'Re-record';
            document.getElementById('recordBtn').classList.remove('stop-button');
            document.getElementById('recordBtn').classList.add('record-button');
            document.getElementById('doneBtn').classList.remove('hidden');
        }

        function resetRecorded() {
            recordedBlob = null;
            recordedDataUrl = null;
            recordedChunks = [];
            const playback = document.getElementById('playback');
            playback.pause();
            playback.removeAttribute('src');
            playback.classList.add('hidden');
            document.getElementById('doneBtn').classList.add('hidden');
            elapsedMs = 0;
            updateTimerDisplay();
        }

        async function startRecording() {
            if (submitting || !choreId || recording) return;
            if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
                showMessage('Microphone not available in this browser.', 'error');
                return;
            }
            if (typeof MediaRecorder === 'undefined') {
                showMessage('Audio recording is not supported on this device.', 'error');
                return;
            }

            hideMessage();
            showMessage('Starting microphone...', 'info');
            resetRecorded();

            // Ask Android for RECORD_AUDIO first so WebView can grant getUserMedia immediately.
            if (window.Android && typeof window.Android.ensureMediaPermissions === 'function') {
                try {
                    await new Promise(function(resolve, reject) {
                        window.__onMediaPermOk = function() { resolve(); };
                        window.__onMediaPermErr = function(msg) { reject(new Error(msg || 'Permission denied')); };
                        window.Android.ensureMediaPermissions(true, false, '__onMediaPermOk', '__onMediaPermErr');
                    });
                } catch (permErr) {
                    showMessage('Microphone permission is required. ' + (permErr && permErr.message ? permErr.message : ''), 'error');
                    return;
                }
            }

            try {
                // Prefer simple constraint; detailed constraints often fail on emulators.
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (firstErr) {
                    console.warn('getUserMedia simple failed, retrying with constraints', firstErr);
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        },
                        video: false
                    });
                }
            } catch (e) {
                const detail = (e && (e.name || e.message)) ? (e.name + ': ' + e.message) : String(e);
                showMessage('Could not access microphone (' + detail + '). On emulator: enable Microphone in Extended controls, then try again.', 'error');
                console.error('getUserMedia error:', e);
                return;
            }

            const mimeType = pickMimeType();
            recordedMimeType = mimeType || 'audio/webm';
            recordedChunks = [];

            try {
                mediaRecorder = mimeType
                    ? new MediaRecorder(mediaStream, { mimeType: mimeType })
                    : new MediaRecorder(mediaStream);
            } catch (e) {
                stopMediaStream();
                showMessage('Could not start recorder: ' + e.message, 'error');
                return;
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onerror = function(event) {
                console.error('MediaRecorder error:', event);
                showMessage('Recording error. Please try again.', 'error');
            };

            mediaRecorder.onstop = async function() {
                stopMediaStream();
                recording = false;
                stopTimer();
                document.getElementById('recordBtn').textContent = 'Re-record';
                document.getElementById('recordBtn').classList.remove('stop-button');
                document.getElementById('recordBtn').classList.add('record-button');

                const type = recordedChunks[0] && recordedChunks[0].type
                    ? recordedChunks[0].type
                    : recordedMimeType;
                recordedBlob = new Blob(recordedChunks, { type: type || 'audio/webm' });
                if (!recordedBlob.size) {
                    showMessage('No audio captured. Please try again.', 'error');
                    return;
                }
                try {
                    recordedDataUrl = await blobToDataUrl(recordedBlob);
                    showRecordedUi();
                    hideMessage();
                } catch (e) {
                    showMessage('Could not prepare recording: ' + e.message, 'error');
                }
            };

            mediaRecorder.start(1000);
            recording = true;
            startTimer();
            document.getElementById('recordBtn').textContent = 'Stop';
            document.getElementById('recordBtn').classList.remove('record-button');
            document.getElementById('recordBtn').classList.add('stop-button');
            hideMessage();
        }

        function stopMediaStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(function(track) { track.stop(); });
                mediaStream = null;
            }
        }

        function stopRecording() {
            if (!recording || !mediaRecorder) return;
            try {
                if (mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            } catch (e) {
                console.error('stopRecording error:', e);
                recording = false;
                stopMediaStream();
                stopTimer();
            }
        }

        function toggleRecord() {
            if (submitting || !choreId) return;
            if (recording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function submitAudio() {
            if (submitting) return;
            if (!recordedDataUrl) {
                showMessage('Record some audio first.', 'error');
                return;
            }
            if (!choreId) {
                showMessage('This chore is missing choreId in the URL.', 'error');
                return;
            }
            if (!window.Android || typeof window.Android.uploadImageToSupabase !== 'function') {
                showMessage('Upload requires the Android app.', 'error');
                return;
            }

            let profile = 'TE';
            if (typeof window.Android.getCurrentProfile === 'function') {
                try {
                    profile = window.Android.getCurrentProfile() || 'TE';
                } catch (e) {
                    console.warn('Could not get profile:', e);
                }
            }

            setBusy(true);
            showMessage('Uploading recording...', 'info');

            // Store full data:audio/...;base64,... URI so parent report can play it.
            const uploadData = {
                profile: profile,
                task: audioTaskKey(choreId, rewardCash),
                image: recordedDataUrl,
                capture_date_time: new Date().toISOString()
            };

            try {
                window.Android.uploadImageToSupabase(
                    JSON.stringify(uploadData),
                    'onUploadSuccess',
                    'onUploadError'
                );
            } catch (e) {
                setBusy(false);
                showMessage('Error calling upload: ' + e.message, 'error');
            }
        }

        window.onUploadSuccess = function() {
            showMessage('Recording submitted! Parent will review for the reward.', 'success');
            if (window.Android && typeof window.Android.gameCompleted === 'function') {
                try {
                    window.Android.gameCompleted(1, 0);
                } catch (e) {
                    setBusy(false);
                    showMessage('Saved but could not finish the task: ' + e.message, 'error');
                }
            } else {
                setBusy(false);
                showMessage('Recording saved. Close this screen when ready.', 'success');
            }
        };

        window.onUploadError = function(error) {
            setBusy(false);
            showMessage('Could not save recording: ' + error, 'error');
            console.error('Upload error:', error);
        };

        document.addEventListener('DOMContentLoaded', function() {
            readParams();
            applyUi();
            updateTimerDisplay();
        });

        window.addEventListener('beforeunload', function() {
            stopRecording();
            stopMediaStream();
        });
    </script>
</body>
</html>
