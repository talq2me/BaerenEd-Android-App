name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode and verify signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: KEY_ALIAS secret is missing or empty. Set it to key1 in repo secrets."
            exit 1
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing or empty."
            exit 1
          fi
          KEYSTORE_PATH="${{ runner.temp }}/keystore.p12"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 >/dev/null 2>&1; then
            echo "ERROR: Could not read keystore after base64 decode."
            echo "Re-create KEYSTORE_BASE64 with: base64 -w0 /path/to/keystore1"
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.type="$KEYSTORE_TYPE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Update version.json on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APK_URL="https://github.com/talq2me/BaerenEd-Android-App/releases/download/${TAG}/app-release.apk"
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]*' | head -1)
          git fetch origin main
          git checkout main
          printf '%s\n' "{" "    \"package\": \"com.talq2me.baerened\"," "    \"latestVersionCode\": ${VERSION_CODE}," "    \"apkUrl\": \"${APK_URL}\"" "}" > app/src/main/assets/config/version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/config/version.json
          if git diff --staged --quiet; then
            echo "version.json already up to date"
          else
            git commit -m "chore: update BaerenEd version.json apkUrl for ${TAG}"
            git push origin main
          fi
